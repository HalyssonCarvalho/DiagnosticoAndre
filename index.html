<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elevra 360° Growth Diagnosis — Leadership Cleaning Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D12;
  --bg-2:#0D1117;
  --panel:#12161D;
  --panel-2:#171C24;
  --panel-3:#1D232C;
  --line:rgba(255,255,255,0.09);
  --line-2:rgba(255,255,255,0.15);
  --text:#EDEFF2;
  --text-dim:#9AA3AF;
  --text-faint:#5C6570;
  --accent:#1FE7AC;
  --accent-dim:rgba(31,231,172,0.14);
  --gold:#D4AF37;
  --gold-dim:rgba(212,175,55,0.14);
  --coral:#FF6B5B;
  --coral-dim:rgba(255,107,91,0.14);
  --blue:#5B8CFF;
  --blue-dim:rgba(91,140,255,0.14);
  --violet:#B98CFF;
  --violet-dim:rgba(185,140,255,0.14);
  --measure:#5B8CFF; --control:#1FE7AC; --convert:#D4AF37; --retain:#B98CFF; --scale:#FF6B5B;
  --radius:14px;
  --serif-disp:'Space Grotesk',sans-serif;
  --body:'Inter',sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse 900px 500px at 8% -10%, rgba(31,231,172,0.07), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 10%, rgba(212,175,55,0.05), transparent 60%);
  pointer-events:none;
  z-index:0;
}
#deck{
  height:100vh; height:100dvh;
  width:100%;
  overflow-y:scroll;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  scroll-behavior:smooth;
  position:relative;
  z-index:1;
}
.slide{
  min-height:100vh; min-height:100dvh;
  width:100%;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  display:flex;
  flex-direction:column;
  justify-content:center;
  position:relative;
  padding:clamp(28px,6vw,88px) clamp(24px,7vw,110px);
  border-bottom:1px solid var(--line);
  background:var(--bg);
}
.slide-inner{ width:100%; max-width:1360px; margin:0 auto; position:relative; z-index:2;}
/* ===== chrome ===== */
.wordmark{
  position:fixed; top:22px; left:clamp(20px,4vw,44px); z-index:50;
  font-family:var(--serif-disp); font-weight:700; font-size:14px; letter-spacing:0.14em;
  color:var(--text-dim); text-transform:uppercase; pointer-events:none;
  display:flex; align-items:center; gap:8px;
}
.wordmark .dot{width:6px;height:6px;border-radius:50%;background:var(--accent); box-shadow:0 0 10px var(--accent);}
.topbar{position:fixed; top:0; left:0; right:0; height:3px; z-index:60; background:rgba(255,255,255,0.06);}
.topbar-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--measure),var(--control),var(--convert),var(--retain),var(--scale)); transition:width .25s ease;}
.counter{
  position:fixed; right:clamp(20px,4vw,44px); bottom:22px; z-index:50;
  font-family:var(--mono); font-size:12px; color:var(--text-faint); letter-spacing:0.05em;
}
.counter b{color:var(--text-dim);}
.dotnav{position:fixed; right:22px; top:50%; transform:translateY(-50%); z-index:50; display:flex; flex-direction:column; gap:6px;}
.dotnav button{width:6px; height:6px; border-radius:50%; border:none; background:rgba(255,255,255,0.18); cursor:pointer; padding:0; transition:all .25s;}
.dotnav button.active{background:var(--accent); height:16px; box-shadow:0 0 8px var(--accent);}
.arrows{position:fixed; right:clamp(20px,4vw,44px); bottom:52px; z-index:50; display:flex; gap:8px;}
.arrows button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2); background:var(--panel); color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px;}
.arrows button:hover{color:var(--accent); border-color:var(--accent);}
/* ===== typography helpers ===== */
.kicker{
  font-family:var(--mono); font-size:11.5px; letter-spacing:0.16em; text-transform:uppercase;
  color:var(--text-faint); display:flex; align-items:center; gap:10px; margin-bottom:18px;
}
.kicker .num{color:var(--text-dim);}
.phase-chip{
  display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10.5px;
  letter-spacing:0.12em; text-transform:uppercase; padding:5px 10px; border-radius:100px;
  border:1px solid var(--line-2); color:var(--text-dim);
}
.phase-chip .dotc{width:6px;height:6px;border-radius:50%;}
h1.disp{font-family:var(--serif-disp); font-weight:700; line-height:1.04; letter-spacing:-0.01em; color:var(--text);}
h2.disp{font-family:var(--serif-disp); font-weight:700; line-height:1.08; letter-spacing:-0.01em; color:var(--text);}
.t-huge{font-size:clamp(32px,5.4vw,64px);}
.t-xl{font-size:clamp(26px,4vw,44px);}
.t-lg{font-size:clamp(21px,2.9vw,31px);}
.sub{color:var(--text-dim); font-size:clamp(14.5px,1.4vw,17px); line-height:1.6; max-width:760px; font-weight:400;}
.lede{color:var(--text-dim); font-size:clamp(15px,1.5vw,18px); line-height:1.65; max-width:820px;}
.accent-txt{color:var(--accent);}
.gold-txt{color:var(--gold);}
.coral-txt{color:var(--coral);}
.mono-tag{font-family:var(--mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint);}
.divider{height:1px; background:var(--line); width:100%; margin:26px 0;}
.badge-warn{
  display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px;
  letter-spacing:0.06em; color:var(--gold); background:var(--gold-dim); border:1px solid rgba(212,175,55,0.35);
  padding:6px 12px; border-radius:6px; margin-top:14px;
}
/* ===== layout helpers ===== */
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:clamp(20px,3vw,48px);}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(14px,2vw,22px);}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(12px,1.6vw,18px);}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:clamp(16px,2vw,24px);}
.card:hover{border-color:var(--line-2);}
.card h4{font-family:var(--serif-disp); font-size:16px; font-weight:600; margin-bottom:8px;}
.card p{color:var(--text-dim); font-size:13.5px; line-height:1.55;}
.pill{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:12px; padding:8px 14px; border-radius:100px; background:var(--panel-2); border:1px solid var(--line); color:var(--text);}
.arrow-down{color:var(--text-faint); font-size:14px; text-align:center; margin:2px 0;}
/* ===== flows ===== */
.flow-v{display:flex; flex-direction:column; gap:0; align-items:flex-start; width:100%;}
.flow-v .fnode{width:100%;}
.flow-h{display:flex; align-items:center; gap:0; flex-wrap:wrap;}
.fchip{
  font-family:var(--mono); font-size:12px; padding:9px 16px; border-radius:8px; background:var(--panel-2);
  border:1px solid var(--line); color:var(--text-dim); white-space:nowrap;
}
.fchip.on{color:var(--bg); background:var(--accent); border-color:var(--accent); font-weight:600;}
.farrow{color:var(--text-faint); font-size:13px; padding:0 8px;}
.flow-chain{display:flex; align-items:center; flex-wrap:wrap; gap:0; row-gap:10px;}
/* scorecard */
.score-row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:9px 0; border-bottom:1px solid var(--line);}
.score-row:last-child{border-bottom:none;}
.score-label{font-size:13.5px; color:var(--text); font-weight:500;}
.score-meter{display:flex; gap:3px;}
.score-meter i{width:16px; height:6px; border-radius:2px; background:rgba(255,255,255,0.1); display:block;}
.score-meter i.fill{background:var(--accent);}
.score-group{margin-bottom:22px;}
.score-group h5{font-family:var(--mono); font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px;}
/* matrix */
.matrix{display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:14px;}
.mquad{border-radius:var(--radius); border:1px solid var(--line); padding:18px 20px; background:var(--panel);}
.mquad h5{font-family:var(--serif-disp); font-size:15px; margin-bottom:10px;}
.mquad ul{list-style:none;}
.mquad li{font-size:13px; color:var(--text-dim); padding:4px 0; padding-left:14px; position:relative;}
.mquad li::before{content:'—'; position:absolute; left:0; color:var(--text-faint);}
/* compare */
.compare{display:grid; grid-template-columns:1fr 1fr; gap:2px; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line);}
.compare-col{padding:22px 24px; background:var(--panel);}
.compare-col.after{background:linear-gradient(180deg, rgba(31,231,172,0.06), transparent);}
.compare-col h5{font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:14px;}
.compare-col.before h5{color:var(--text-faint);}
.compare-col.after h5{color:var(--accent);}
.compare-col ul{list-style:none;}
.compare-col li{font-size:13.5px; padding:6px 0; color:var(--text-dim);}
.compare-col.after li{color:var(--text);}
.compare-col li::before{content:'○ '; color:var(--text-faint);}
.compare-col.after li::before{content:'● '; color:var(--accent);}
/* stat */
.stat-big{font-family:var(--serif-disp); font-weight:700; font-size:clamp(40px,6vw,72px); line-height:1;}
.leak-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
.leak-card{border:1px solid rgba(255,107,91,0.25); background:rgba(255,107,91,0.05); border-radius:12px; padding:14px 16px;}
.leak-card h5{font-family:var(--mono); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--coral); margin-bottom:6px;}
.leak-card p{font-size:12.5px; color:var(--text-dim); line-height:1.5;}
/* timeline */
.tline{display:flex; gap:0; position:relative; padding-top:10px;}
.tline::before{content:''; position:absolute; top:16px; left:0; right:0; height:1px; background:var(--line);}
.tpoint{flex:1; position:relative; padding:0 10px; text-align:left;}
.tpoint .dotm{width:9px;height:9px;border-radius:50%; background:var(--accent); position:relative; z-index:2; margin-bottom:14px;}
.tpoint h6{font-family:var(--mono); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text); margin-bottom:6px;}
.tpoint p{font-size:12.5px; color:var(--text-dim); line-height:1.5;}
/* footer note */
.foot-note{margin-top:20px; font-family:var(--mono); font-size:11px; color:var(--text-faint); letter-spacing:0.02em;}
.section-lbl{font-family:var(--serif-disp); font-weight:600; font-size:14px; color:var(--text); margin-bottom:14px; display:flex; align-items:center; gap:8px;}
.section-lbl .n{width:22px; height:22px; border-radius:50%; border:1px solid var(--line-2); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:10px; color:var(--text-dim);}
/* cover */
.cover-wrap{display:flex; flex-direction:column; height:100%; justify-content:center;}
.cover-brand{font-family:var(--mono); font-size:12px; letter-spacing:0.2em; color:var(--text-faint); text-transform:uppercase; margin-bottom:34px;}
.cover-title{font-family:var(--serif-disp); font-weight:700; font-size:clamp(36px,6.8vw,86px); line-height:1.03; letter-spacing:-0.015em;}
.cover-sub{margin-top:26px; font-size:clamp(15px,1.6vw,19px); color:var(--text-dim); max-width:660px; line-height:1.6;}
.cover-meta{margin-top:56px; display:flex; gap:40px; flex-wrap:wrap;}
.cover-meta div{font-family:var(--mono); font-size:11.5px; color:var(--text-faint);}
.cover-meta div b{display:block; color:var(--text); font-size:13.5px; font-weight:500; margin-top:4px; font-family:var(--body);}
/* dashboard mock */
.dash{border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); overflow:hidden;}
.dash-head{display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); background:var(--panel-2);}
.dash-head span{font-family:var(--mono); font-size:11px; color:var(--text-faint); letter-spacing:0.08em; text-transform:uppercase;}
.dash-grid{display:grid; grid-template-columns:repeat(5,1fr);}
.dash-col{padding:16px 14px; border-right:1px solid var(--line);}
.dash-col:last-child{border-right:none;}
.dash-col h6{font-family:var(--mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); margin-bottom:10px;}
.dash-col ul{list-style:none;}
.dash-col li{font-size:12px; color:var(--text-dim); padding:4px 0; border-top:1px dashed var(--line);}
.dash-col li:first-child{border-top:none;}
/* radar/architecture band */
.arch{display:flex; flex-direction:column; gap:0; position:relative;}
.arch-band{display:grid; grid-template-columns:160px 1fr; gap:20px; align-items:center; padding:16px 0; position:relative;}
.arch-band + .arch-band{border-top:1px dashed var(--line);}
.arch-label{font-family:var(--serif-disp); font-weight:600; font-size:15px; color:var(--text); display:flex; align-items:center; gap:10px;}
.arch-label .idx{font-family:var(--mono); font-size:11px; color:var(--text-faint);}
.arch-chips{display:flex; flex-wrap:wrap; gap:8px;}
.arch-chips span{font-family:var(--mono); font-size:11.5px; padding:6px 12px; border-radius:6px; background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim);}
/* offer arch */
.offer-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
.offer-card{border-radius:12px; border:1px solid var(--line); padding:16px; background:var(--panel);}
.offer-card .tag{font-family:var(--mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent); margin-bottom:8px;}
.offer-card h5{font-family:var(--serif-disp); font-size:15px; margin-bottom:6px;}
.offer-card p{font-size:12px; color:var(--text-dim); line-height:1.5;}
/* flywheel */
.wheel-wrap{display:flex; align-items:center; justify-content:center; gap:clamp(20px,4vw,60px); flex-wrap:wrap;}
.wheel{width:min(46vw,380px); height:min(46vw,380px); position:relative;}
.wheel svg{width:100%; height:100%; animation:spin 60s linear infinite;}
@keyframes spin{from{transform:rotate(0)} to{transform:rotate(360deg)}}
.wheel-center{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center;}
.wheel-center b{font-family:var(--serif-disp); font-size:14px;}
.wheel-center span{font-family:var(--mono); font-size:9.5px; color:var(--text-faint); letter-spacing:0.1em;}
@media (prefers-reduced-motion: reduce){ .wheel svg{animation:none;} }
/* responsive */
@media (max-width:900px){
  .dotnav{display:none;}
  .grid-2{grid-template-columns:1fr; gap:26px;}
  .grid-3{grid-template-columns:1fr;}
  .grid-4{grid-template-columns:1fr 1fr;}
  .leak-grid{grid-template-columns:1fr 1fr;}
  .matrix{grid-template-columns:1fr; grid-template-rows:auto;}
  .compare{grid-template-columns:1fr;}
  .offer-grid{grid-template-columns:1fr 1fr;}
  .dash-grid{grid-template-columns:1fr 1fr;}
  .dash-col{border-right:none; border-bottom:1px solid var(--line);}
  .tline{flex-direction:column; gap:16px;}
  .tline::before{display:none;}
  .arch-band{grid-template-columns:1fr; gap:8px;}
  .cover-meta{gap:22px;}
  .slide{padding:88px 22px 70px;}
}
@media (max-width:560px){
  .grid-4{grid-template-columns:1fr;}
  .leak-grid{grid-template-columns:1fr;}
  .offer-grid{grid-template-columns:1fr;}
  .dash-grid{grid-template-columns:1fr;}
  .arrows{bottom:70px;}
  .counter{bottom:76px;}
}
::-webkit-scrollbar{width:0;}
</style>
</head>
<body>

<div class="wordmark"><span class="dot"></span> ELEVRA DIGITAL</div>
<div class="topbar"><div class="topbar-fill" id="topbarFill"></div></div>
<div class="counter"><b id="curNum">01</b> / <span id="totNum">32</span></div>
<div class="arrows"><button id="prevBtn" aria-label="Slide anterior">↑</button><button id="nextBtn" aria-label="Próximo slide">↓</button></div>
<div class="dotnav" id="dotnav"></div>

<main id="deck"></main>

<script>
/* ============ COMPONENT HELPERS ============ */
const PHASES = {
  measure:{c:'var(--measure)', l:'Medir'},
  control:{c:'var(--control)', l:'Controlar'},
  convert:{c:'var(--convert)', l:'Converter'},
  retain:{c:'var(--retain)', l:'Reter'},
  scale:{c:'var(--scale)', l:'Escalar'},
  none:{c:'var(--text-faint)', l:'Diagnóstico'}
};
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }

function flowChain(container, steps, opts={}){
  const wrap = el('div','flow-chain');
  steps.forEach((s,i)=>{
    const chip = el('div','fchip'+(opts.highlight&&opts.highlight.includes(i)?' on':''), s);
    wrap.appendChild(chip);
    if(i<steps.length-1){ wrap.appendChild(el('span','farrow','→')); }
  });
  container.appendChild(wrap);
}

function cardsGrid(container, cards, colClass='grid-3'){
  const wrap = el('div',colClass);
  cards.forEach(c=>{
    const card = el('div','card');
    card.innerHTML = `<h4>${c.t}</h4><p>${c.d}</p>`;
    wrap.appendChild(card);
  });
  container.appendChild(wrap);
}

function leakGrid(container, leaks){
  const wrap = el('div','leak-grid');
  leaks.forEach(l=>{
    const c = el('div','leak-card');
    c.innerHTML = `<h5>${l.t}</h5><p>${l.d}</p>`;
    wrap.appendChild(c);
  });
  container.appendChild(wrap);
}

function scoreCard(container, groups){
  groups.forEach(g=>{
    const gwrap = el('div','score-group');
    gwrap.appendChild(el('h5','', g.name));
    g.items.forEach(it=>{
      const row = el('div','score-row');
      let meter = '';
      for(let i=1;i<=5;i++){ meter += `<i class="${i<=it.s?'fill':''}"></i>`; }
      row.innerHTML = `<span class="score-label">${it.l}</span><span class="score-meter">${meter}</span>`;
      gwrap.appendChild(row);
    });
    container.appendChild(gwrap);
  });
}

function matrixQuad(container, quads){
  const wrap = el('div','matrix');
  quads.forEach(q=>{
    const qd = el('div','mquad');
    qd.innerHTML = `<h5>${q.t}</h5><ul>${q.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
    wrap.appendChild(qd);
  });
  container.appendChild(wrap);
}

function compareBlock(container, beforeItems, afterItems, beforeLabel='ANTES', afterLabel='DEPOIS'){
  const wrap = el('div','compare');
  const b = el('div','compare-col before');
  b.innerHTML = `<h5>${beforeLabel}</h5><ul>${beforeItems.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  const a = el('div','compare-col after');
  a.innerHTML = `<h5>${afterLabel}</h5><ul>${afterItems.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  wrap.appendChild(b); wrap.appendChild(a);
  container.appendChild(wrap);
}

function timelineBlock(container, points){
  const wrap = el('div','tline');
  points.forEach(p=>{
    const tp = el('div','tpoint');
    tp.innerHTML = `<div class="dotm"></div><h6>${p.t}</h6><p>${p.d}</p>`;
    wrap.appendChild(tp);
  });
  container.appendChild(wrap);
}

function archBlock(container, bands){
  const wrap = el('div','arch');
  bands.forEach((b,i)=>{
    const band = el('div','arch-band');
    band.innerHTML = `<div class="arch-label"><span class="idx">0${i+1}</span>${b.t}</div><div class="arch-chips">${b.items.map(x=>`<span>${x}</span>`).join('')}</div>`;
    wrap.appendChild(band);
  });
  container.appendChild(wrap);
}

function offerGrid(container, offers){
  const wrap = el('div','offer-grid');
  offers.forEach(o=>{
    const c = el('div','offer-card');
    c.innerHTML = `<div class="tag">${o.tag}</div><h5>${o.t}</h5><p>${o.d}</p>`;
    wrap.appendChild(c);
  });
  container.appendChild(wrap);
}

function dashMock(container, cols){
  const d = el('div','dash');
  d.innerHTML = `<div class="dash-head"><span>Elevra Revenue Dashboard — Visão Executiva</span><span>Ao vivo / Onboarding</span></div>`;
  const grid = el('div','dash-grid');
  cols.forEach(c=>{
    const col = el('div','dash-col');

/* ============ RENDER DECK ============ */
const deck = document.getElementById('deck');
const dotnav = document.getElementById('dotnav');
document.getElementById('totNum').textContent = String(slides.length).padStart(2,'0');

slides.forEach((s, idx)=>{
  const sec = el('section','slide'); sec.id = 'slide-'+idx;
  const inner = el('div','slide-inner');
  sec.appendChild(inner);
  s.build(inner, idx+1);
  deck.appendChild(sec);
  const dot = el('button'); dot.dataset.idx = idx; dot.title = (idx+1)+' / '+slides.length;
  dot.addEventListener('click', ()=>document.getElementById('slide-'+idx).scrollIntoView({behavior:'smooth'}));
  dotnav.appendChild(dot);
});

/* active tracking */
let current = 0;
const dots = Array.from(dotnav.children);
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting && e.intersectionRatio>0.5){
      const idx = Array.from(deck.children).indexOf(e.target);
      current = idx;
      dots.forEach(d=>d.classList.remove('active'));
      if(dots[idx]) dots[idx].classList.add('active');
      document.getElementById('curNum').textContent = String(idx+1).padStart(2,'0');
      document.getElementById('topbarFill').style.width = ((idx+1)/slides.length*100)+'%';
    }
  });
},{root:deck, threshold:[0.5]});
Array.from(deck.children).forEach(c=>io.observe(c));

function goTo(idx){
  idx = Math.max(0, Math.min(slides.length-1, idx));
  document.getElementById('slide-'+idx).scrollIntoView({behavior:'smooth'});
}
document.getElementById('nextBtn').addEventListener('click', ()=>goTo(current+1));
document.getElementById('prevBtn').addEventListener('click', ()=>goTo(current-1));
window.addEventListener('keydown', (e)=>{
  if(['ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); goTo(current+1); }
  if(['ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); goTo(current-1); }
  if(e.key==='Home'){ e.preventDefault(); goTo(0); }
  if(e.key==='End'){ e.preventDefault(); goTo(slides.length-1); }
});
</script>
